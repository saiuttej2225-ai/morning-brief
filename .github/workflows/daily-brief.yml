name: Daily brief

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 7 AM New York (8 AM in summer time)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and send briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python runner.py
      - name: Save what was sent (so stories never repeat)
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Update sent log" && git push)
