name: Daily brief

on:
  # No schedule here on purpose. GitHub's own scheduler started runs hours late,
  # so cron-job.org calls this workflow at 6:00 AM New York every day instead.
  workflow_dispatch: {}      # used by the outside timer, and by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and send briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python runner.py
      - name: Save what was sent (so stories never repeat)
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Update sent log"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
